[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchproof"
version = "1.1.0"
description = "Deterministic trust boundary and bounded AI repair engine for automated patch verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sahil Pal", email = "sahilpal.dev@gmail.com" },
    { name = "PatchProof Core Team", email = "core@patchproof.dev" },
]
maintainers = [
    { name = "Sahil Pal", email = "sahilpal.dev@gmail.com" },
]
keywords = [
    "autonomous-agents",
    "automated-software-repair",
    "ai-coding",
    "langgraph",
    "test-verification",
    "anti-cheat",
    "claim-ledger",
    "epistemology",
    "swe-bench",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.40",
    "langchain-core>=0.2.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "pyyaml>=6.0.1",
    "junitparser>=3.1.2",
    "gitpython>=3.1.43",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/saahilpal/patchproof"
Documentation = "https://github.com/saahilpal/patchproof/blob/main/docs/PRD.md"
Repository = "https://github.com/saahilpal/patchproof"
Issues = "https://github.com/saahilpal/patchproof/issues"
Changelog = "https://github.com/saahilpal/patchproof/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.1",
    "mypy>=1.9.0",
]

[project.scripts]
patchproof = "patchproof.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["tests/fixtures"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
